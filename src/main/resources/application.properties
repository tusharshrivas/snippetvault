# ============================================================
# APPLICATION
# ============================================================
spring.application.name=snippetvault
server.port=${PORT:8080}

# ============================================================
# DATASOURCE ? PostgreSQL
# Value comes from environment variable; local default for dev
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/snippetvault}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP is Spring Boot's default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# REDIS ? used for rate limiting counters
# ============================================================
spring.data.redis.url=${REDIS_URL}

# ============================================================
# JWT
# Secret must be Base64-encoded and at least 256 bits (32 bytes)
# Generate: openssl rand -base64 64
# ============================================================
jwt.secret=${JWT_SECRET:bXlzdXBlcnNlY3JldGtleW15c3VwZXJzZWNyZXRrZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MA==}
jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:1800000}
jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# ============================================================
# RATE LIMITING
# ============================================================
rate.limit.unauthenticated.requests-per-minute=10
rate.limit.authenticated.requests-per-minute=100

# ============================================================
# SPRINGDOC / SWAGGER UI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ============================================================
# LOGGING
# ============================================================
logging.level.com.snippetvault=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN