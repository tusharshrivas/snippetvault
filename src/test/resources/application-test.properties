# ============================================================
# TEST PROFILE ? used automatically by @SpringBootTest tests
# Unit tests using @ExtendWith(MockitoExtension.class) don't
# load Spring context at all, so this file only applies to
# integration-style tests.
# ============================================================

# H2 in-memory database ? no real Postgres needed in tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Dummy JWT secret for tests (must be valid Base64, >= 32 bytes)
jwt.secret=dGVzdC1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMzItYnl0ZXMhIQ==
jwt.access-token-expiry-ms=1800000
jwt.refresh-token-expiry-ms=604800000

# Rate limiting values
rate.limit.unauthenticated.requests-per-minute=10
rate.limit.authenticated.requests-per-minute=100

# Suppress Redis auto-configuration in tests that don't need it
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration